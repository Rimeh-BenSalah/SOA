server:
  port: 8083
spring:
  application:
    name: theme
  datasource:
    url: 'jdbc:h2:mem:themedb'
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:http://localhost:9999/"
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    discovery:
      enabled: true
eureka:
  instance:
    prefer-ip-address: true
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'
management:
  endpoints:
    web:
      exposure:
        include: '*'